<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var l = window.location;
      var base = '/default-sqd-web';
      l.replace(
        l.protocol + '//' + l.host + base +
        '/?p=' + encodeURIComponent(
          l.pathname.replace(base, '') + l.search
        ) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
