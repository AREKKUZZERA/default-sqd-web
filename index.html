<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SQD - темная социальная платформа для постов, профиля и личных сообщений."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>SQD - social feed</title>

    <!-- GitHub Pages SPA redirect fix -->
    <script>
      (function() {
        var query = window.location.search;
        if (query && query.indexOf('?p=') === 0) {
          var path = decodeURIComponent(query.slice(3));
          window.history.replaceState(null, null, path + window.location.hash);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
